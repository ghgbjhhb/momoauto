<!doctype html>
<html lang="zh-CN" data-ui="v2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>登录 - momo全托管</title>
  <link rel="stylesheet" href="/vendor/open-props.min.css">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/ui.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-page);
      font-family: var(--font-sans);
      color: var(--text-1);
      -webkit-font-smoothing: antialiased;
      padding: var(--sp-20);
    }

    .auth-wrapper {
      width: 100%;
      max-width: 400px;
    }

    .auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--r-8);
      padding: var(--sp-32) var(--sp-24);
      box-shadow: var(--elev-2);
    }

    .brand-section {
      text-align: center;
      margin-bottom: var(--sp-24);
    }

    .brand-logo {
      width: var(--h-toolbar);
      height: var(--h-toolbar);
      margin: 0 auto var(--sp-12);
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      border-radius: var(--r-8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .brand-logo svg {
      width: var(--icon-20);
      height: var(--icon-20);
    }

    .brand-title {
      font-size: var(--fs-20);
      font-weight: var(--fw-600);
      color: var(--text-1);
      letter-spacing: -0.02em;
      line-height: var(--lh-tight);
    }

    /* 选项卡 */
    .tab-nav {
      display: flex;
      background: var(--bg-subtle);
      padding: var(--sp-4);
      border-radius: var(--r-6);
      margin-bottom: var(--sp-20);
      gap: var(--sp-4);
      border: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      height: var(--h-control);
      border: none;
      background: transparent;
      color: var(--text-2);
      font-size: var(--fs-13);
      font-weight: var(--fw-500);
      border-radius: var(--r-4);
      cursor: pointer;
      transition: background-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
    }

    .tab-btn.active {
      background: var(--bg-surface);
      color: var(--text-1);
      box-shadow: var(--elev-1);
    }

    /* 表单控件 */
    .form-group {
      margin-bottom: var(--sp-16);
    }

    .form-label {
      display: block;
      font-size: var(--fs-12);
      font-weight: var(--fw-500);
      color: var(--text-2);
      margin-bottom: var(--sp-6);
    }

    .form-input {
      width: 100%;
      height: var(--h-control-lg);
      padding: 0 var(--sp-12);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--r-6);
      font-size: var(--fs-13);
      color: var(--text-1);
      outline: none;
      transition: border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);
    }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: var(--focus-ring);
    }

    .form-input::placeholder {
      color: var(--text-3);
    }

    /* 主按钮 */
    .submit-btn {
      width: 100%;
      height: var(--h-control-lg);
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: var(--r-6);
      color: var(--text-on-accent);
      font-size: var(--fs-13);
      font-weight: var(--fw-500);
      cursor: pointer;
      box-shadow: var(--elev-1);
      transition: background-color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
      margin-top: var(--sp-8);
    }

    .submit-btn:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .submit-btn:active {
      background: var(--accent);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 提示信息 */
    .alert-box {
      padding: var(--sp-8) var(--sp-12);
      border-radius: var(--r-6);
      font-size: var(--fs-12);
      line-height: var(--lh-normal);
      margin-bottom: var(--sp-16);
      display: none;
    }

    .alert-box.error {
      display: block;
      background: var(--danger-soft);
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    .alert-box.success {
      display: block;
      background: var(--ok-soft);
      border: 1px solid var(--ok);
      color: var(--ok);
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-section">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="2" width="14" height="20" rx="3"></rect>
            <path d="M12 18h.01"></path>
          </svg>
        </div>
        <h1 class="brand-title">momo全托管</h1>
      </div>

      <div class="tab-nav">
        <button class="tab-btn active" id="tabLogin" type="button">登录</button>
        <button class="tab-btn" id="tabRegister" type="button">注册</button>
      </div>

      <div class="alert-box" id="alertBox" role="alert"></div>

      <form id="authForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="emailInput">账号邮箱</label>
          <input
            id="emailInput"
            name="email"
            class="form-input"
            type="email"
            placeholder="请输入注册邮箱"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordInput">登录密码</label>
          <input
            id="passwordInput"
            name="password"
            class="form-input"
            type="password"
            placeholder="请输入密码"
            required
            autocomplete="current-password"
          >
        </div>

        <div class="form-group" id="confirmGroup" style="display: none;">
          <label class="form-label" for="confirmPasswordInput">确认密码</label>
          <input
            id="confirmPasswordInput"
            class="form-input"
            type="password"
            placeholder="请再次输入密码"
            autocomplete="new-password"
          >
        </div>

        <button class="submit-btn" id="submitBtn" type="submit">
          <span id="btnText">立即登录</span>
        </button>
      </form>
    </div>
  </div>

  <script src="/logger.js"></script>
  <script>
    'use strict';
    // 旧版保存在 localStorage 的长期 Token 已停用，统一使用 HttpOnly Cookie。
    try { localStorage.removeItem('yunmomo.auth_token'); } catch {}
    let mode = 'login';

    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const confirmGroup = document.getElementById('confirmGroup');
    const authForm = document.getElementById('authForm');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const confirmPasswordInput = document.getElementById('confirmPasswordInput');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const alertBox = document.getElementById('alertBox');

    function showAlert(text, type = 'error') {
      alertBox.textContent = text;
      alertBox.className = `alert-box ${type}`;
      alertBox.style.display = '';
    }

    function hideAlert() {
      alertBox.className = 'alert-box';
      alertBox.style.display = '';
      alertBox.textContent = '';
    }

    function switchMode(newMode) {
      mode = newMode;
      hideAlert();
      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        confirmGroup.style.display = 'none';
        confirmPasswordInput.removeAttribute('required');
        btnText.textContent = '立即登录';
      } else {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        confirmGroup.style.display = 'block';
        confirmPasswordInput.setAttribute('required', 'required');
        btnText.textContent = '注册并登录';
      }
    }

    tabLogin.addEventListener('click', () => switchMode('login'));
    tabRegister.addEventListener('click', () => switchMode('register'));

    async function doLogin(email, password) {
      submitBtn.disabled = true;
      btnText.textContent = '正在进入…';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const result = await response.json();

        if (!response.ok || !result.ok) {
          showAlert(result.error || '登录失败，请核对账号与密码');
          submitBtn.disabled = false;
          btnText.textContent = '立即登录';
          return;
        }

        showAlert('登录成功，正在进入工作台…', 'success');
        setTimeout(() => {
          location.href = '/index.html';
        }, 300);
      } catch (err) {
        showAlert('网络连接失败，请检查服务状态');
        submitBtn.disabled = false;
        btnText.textContent = '立即登录';
      }
    }

    authForm.addEventListener('submit', async event => {
      event.preventDefault();
      hideAlert();

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email) {
        showAlert('请输入邮箱');
        return;
      }
      if (password.length < 6) {
        showAlert('密码长度至少需要 6 个字符');
        return;
      }

      if (mode === 'register') {
        const confirmPassword = confirmPasswordInput.value;
        if (password !== confirmPassword) {
          showAlert('两次输入的密码不一致，请核对');
          return;
        }

        submitBtn.disabled = true;
        btnText.textContent = '正在注册…';
        try {
          const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const result = await response.json();
          if (!response.ok || !result.ok) {
            showAlert(result.error || '注册失败');
            submitBtn.disabled = false;
            btnText.textContent = '注册并登录';
            return;
          }
          showAlert('注册成功，正在进入工作台…', 'success');
          setTimeout(() => {
            location.href = '/index.html';
          }, 300);
        } catch {
          showAlert('网络连接失败');
          submitBtn.disabled = false;
          btnText.textContent = '注册并登录';
        }
        return;
      }

      doLogin(email, password);
    });

    // 检查是否已有活跃会话，已有则直接进入
    fetch('/api/auth/me')
      .then(r => r.json())
      .then(res => {
        if (res.ok && res.user) {
          location.href = '/index.html';
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
